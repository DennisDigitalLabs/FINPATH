version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: finpath_postgres
    environment:
      POSTGRES_USER: finpath
      POSTGRES_PASSWORD: finpath_dev
      POSTGRES_DB: finpath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpath"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finpath

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finpath_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finpath.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - finpath

volumes:
  postgres_data:

networks:
  finpath:
    driver: bridge
