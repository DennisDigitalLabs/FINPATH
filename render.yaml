services:
  - type: web
    name: finpath-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install --upgrade pip && pip install -r requirements-production.txt"
    startCommand: "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: CORS_ORIGINS
        value: '["https://finpath-frontend.onrender.com"]'
      - key: FRONTEND_URL
        value: "https://finpath-frontend.onrender.com"
      - key: RESET_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: MODEL_PATH
        value: models/v1
      - key: MODEL_VERSION
        value: v1

  - type: web
    name: finpath-frontend
    runtime: static
    rootDir: .
    staticPublishPath: frontend
    buildCommand: ""
    envVars:
      - key: API_BASE_URL
        value: "https://finpath-backend.onrender.com"
