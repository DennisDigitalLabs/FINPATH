services:
  - type: web
    name: finpath-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: "pip install --upgrade pip && pip install -r requirements-production.txt"
    startCommand: "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: '["https://finpath-1afl.onrender.com"]'
      - key: FRONTEND_URL
        value: "https://finpath-1afl.onrender.com"
      - key: RESET_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: MODEL_PATH
        value: models/v1
      - key: MODEL_VERSION
        value: v1

  - type: web
    name: finpath
    runtime: static
    rootDir: .
    staticPublishPath: frontend
    buildCommand: ""
    routes:
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /login
        destination: /login.html
      - type: rewrite
        source: /register
        destination: /register.html
      - type: rewrite
        source: /forgot-password
        destination: /forgot-password.html
      - type: rewrite
        source: /reset-password
        destination: /reset-password.html
      - type: rewrite
        source: /dashboard
        destination: /dashboard.html
      - type: rewrite
        source: /assessment
        destination: /assessment.html
      - type: rewrite
        source: /prediction
        destination: /prediction.html
      - type: rewrite
        source: /recommendations
        destination: /recommendations.html
      - type: rewrite
        source: /analytics
        destination: /analytics.html
      - type: rewrite
        source: /profile
        destination: /profile.html
      - type: rewrite
        source: /admin
        destination: /admin.html

